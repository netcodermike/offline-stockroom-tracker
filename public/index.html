<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Stockroom Tracker</title><style>body{background:#142336;color:#f1f4ee;font:17px system-ui;max-width:1100px;margin:30px auto;padding:20px}h1{font-size:42px}button,input,select,textarea{font:inherit;padding:9px;margin:5px;border-radius:5px}button{background:#9fe0bc;cursor:pointer;border:0}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #496076;text-align:left}canvas{background:white;max-width:100%;touch-action:none}textarea{width:90%;min-height:110px}#status{min-height:24px}a{color:#9fe0bc}@media print{body{background:white;color:black}button,input,select{display:none}}</style><h1>Offline Stockroom Tracker</h1><p>Numeric SKUs · equal-unit counts · local browser storage</p><input id="sku" placeholder="Numeric SKU"><input id="name" placeholder="Item name"><input id="qty" type="number" min="0" value="0" aria-label="Quantity"><input id="min" type="number" min="0" value="0" aria-label="Reorder minimum"><button id="add">Add item</button><button id="save">Save locally</button><button id="export">Export JSON</button><input id="import" type="file" accept=".json" aria-label="Import inventory"><table><thead><tr><th>SKU / barcode</th><th>Name</th><th>Count</th><th>Reorder</th><th>Move stock</th></tr></thead><tbody id="rows"></tbody></table><button onclick="print()">Print labels/table</button><p id="status" role="status"></p><script type="module">
import{validate,adjust,barcode}from'/core.js';const el=id=>document.getElementById(id);let items=[];const msg=e=>el('status').textContent=e.message||e;try{items=validate(JSON.parse(localStorage.getItem('stockroom')||'[]'));}catch(e){msg(e);}
function draw(){el('rows').replaceChildren();for(const item of items){const row=document.createElement('tr');for(const text of [item.sku,item.name,String(item.qty),item.qty<item.minimum?'LOW (min '+item.minimum+')':'OK']){const cell=document.createElement('td');cell.textContent=text;row.append(cell);}const bars=barcode(item.sku);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${bars.length} 40`);svg.setAttribute('width','210');svg.setAttribute('height','50');svg.style.background='white';bars.split('').forEach((bit,x)=>{if(bit==='1'){const r=document.createElementNS(svg.namespaceURI,'rect');r.setAttribute('x',x);r.setAttribute('width',1);r.setAttribute('height',40);svg.append(r);}});row.firstChild.append(document.createElement('br'),svg);const controls=document.createElement('td');for(const d of [-1,1]){const b=document.createElement('button');b.textContent=d>0?'+1':'−1';b.onclick=()=>{try{items=adjust(items,item.sku,d);draw();}catch(e){msg(e);}};controls.append(b);}row.append(controls);el('rows').append(row);}}
el('add').onclick=()=>{try{items=validate([...items,{sku:el('sku').value,name:el('name').value,qty:+el('qty').value,minimum:+el('min').value}]);draw();}catch(e){msg(e);}};el('save').onclick=()=>{try{localStorage.setItem('stockroom',JSON.stringify(items));msg('Saved locally.');}catch(e){msg(e);}};el('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='inventory.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};el('import').onchange=async()=>{try{const f=el('import').files[0];if(f.size>2000000)throw Error('File too large');items=validate(JSON.parse(await f.text()));draw();}catch(e){msg(e);}};draw();
</script></html>
